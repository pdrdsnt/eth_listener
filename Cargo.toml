[package]
name = "eth_decoder"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy = { version = "1.6.1", features = ["provider-ws","pubsub","rpc-types"] }
alloy-contract = "1.5.7"
alloy-primitives = "1.3.1"
alloy-sol-types = "1.5.7"
serde = { version = "1.0.223", features = ["derive"] }
futures-util = "0.3"
tokio = { version = "1.47.1", features = ["rt-multi-thread"] }
